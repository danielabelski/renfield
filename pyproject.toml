# Renfield - Project Configuration
# =================================

[project]
name = "renfield"
version = "0.1.0"
requires-python = ">=3.11"

# =============================================================================
# Ruff - Linter & Formatter
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src/backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
# 🛑 `BLE` (blind-except) ist ABSICHTLICH nicht ausgewaehlt, und das ist eine
# Entscheidung, keine Luecke. Gemessen am 2026-09-27 mit der festgenagelten
# ruff-Version: **851 Stellen in `src/backend`, 89 in `tests` — 940 insgesamt**,
# und JEDE einzelne braeuchte einen `noqa`, weil dieser Commit die 371 alten
# entfernt hat.
#
# Die Zahl ist die Korrektur eines eigenen Fehlers: hier stand zuerst „577
# Stellen, 206 Gummistempel". Die 577 waren gemessen, WAEHREND die 371 toten
# `noqa: BLE001` noch dastanden — ein `noqa` unterdrueckt den Befund eben doch,
# sobald man die Regel ausdruecklich auswaehlt. Eine Zahl, die nur vor der
# eigenen Aenderung galt, ist keine Begruendung. 577 + 371 = 948 ≈ 940, die
# Rechnung geht auf.
#
# Das Argument wird dadurch STAERKER, nicht schwaecher: der grosse Teil dieser
# Stellen ist das gewollte Muster an Dienstgrenzen — „eine fehlgeschlagene
# Benachrichtigung darf die Aufgabe nie umbringen", „ein geschlossener WebSocket
# darf eine foederierte Abfrage nicht abbrechen". Die Regel scharf zu machen
# hiesse 940 Gummistempel ohne eine einzige echte Fangstelle. Wer hier trotzdem
# `# noqa: BLE001` schreibt, bekommt ihn von RUF100 als toten Ballast zurueck —
# das ist der Hinweis, nicht ein Fehler.
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — intentional for conditional/lazy imports
    "B008",   # function call in default argument (FastAPI Depends)
    "B904",   # raise without from inside except — too noisy
    "SIM102", # collapsible-if — readability preference
    "SIM105", # suppressible-exception — readability preference
    "SIM108", # ternary operator — readability preference
    "UP007",  # X | Y union syntax — keep Optional[X] for clarity
    "RUF012", # mutable-class-default — false positives on Pydantic models
    "RUF013", # implicit-optional — gradual migration, too many changes at once
    "SIM117", # multiple-with-statements — verschachtelte `with` bleiben lesbarer,
              # dieselbe Haltung wie SIM102/105/108 daneben
    "UP042",  # replace-str-enum — `class X(str, Enum)` -> `StrEnum` aendert das
              # Verhalten von `str(x)` und damit JSON-Ausgaben. Kein Umbau ohne
              # Anlass; die 16 Stellen liegen in Schemata, die ueber die API gehen.
    # Mehrdeutige Unicode-Zeichen: das Projekt schreibt deutsche Prosa in
    # Docstrings und Modulkoepfen. `×`, `–` und „…" sind dort die RICHTIGEN
    # Zeichen, nicht Tippfehler. 106 Befunde, alle typografisch gewollt.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
known-first-party = ["services", "api", "models", "utils", "integrations", "prompts"]

[tool.ruff.lint.per-file-ignores]
"src/backend/alembic/**" = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# E702 (Semikolon-Mehrfachanweisung) nur in Tests: dort verdichtet
# `a = 1; b = 2` bewusst Tabellenaufbau und Fixture-Vorbereitung. 57 Stellen,
# alle in Testdateien. Im Produktionscode bleibt die Regel scharf.
"tests/**" = ["B011", "SIM300", "E702"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests",
    "database: Tests requiring database",
    "backend: Backend-specific tests",
    "frontend: Frontend-specific tests",
    "satellite: Satellite-specific tests",
    "eval: Evaluation tests (require running Ollama, slow)",
    "postgres: Tests requiring real PostgreSQL + pgvector (skipped on sqlite test harness)",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["src/backend"]
omit = [
    "*/alembic/*",
    "*/conftest.py",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
fail_under = 50  # Conservative start — raise gradually after measuring CI baseline
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]
